<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>__TITLE__</title>
<style nonce="__NONCE__">
:root {
  color-scheme: dark;
  --bg: #0d1117;
  --panel: #161b22;
  --line: #30363d;
  --text: #e6edf3;
  --dim: #8b949e;
  --accent: #58a6ff;
  --good: #3fb950;
  --warn: #d29922;
  --bad: #f85149;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
header {
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 2;
}
h1 { font-size: 16px; margin: 0; font-weight: 600; }
#status { color: var(--dim); }
#status.err { color: var(--bad); }
main { padding: 20px; display: grid; gap: 20px; }
.row {
  display: grid;
  gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px 14px;
}
.card .k { color: var(--dim); font-size: 12px; }
.card .v { font-size: 22px; margin-top: 4px; overflow-wrap: anywhere; }
.card .u { color: var(--dim); font-size: 12px; margin-left: 4px; }
section > h2 {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--dim);
  margin: 0 0 10px;
  font-weight: 600;
}
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.chart .k { color: var(--dim); font-size: 12px; display: flex; justify-content: space-between; }
svg { display: block; width: 100%; height: 56px; margin-top: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--dim); font-weight: 600; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.note { color: var(--dim); font-size: 12px; }
.pill { border-radius: 999px; padding: 1px 8px; font-size: 12px; border: 1px solid var(--line); }
.pill.on { color: var(--good); border-color: var(--good); }
.pill.off { color: var(--bad); border-color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <span id="version" class="note"></span>
  <span id="status">loading…</span>
</header>
<main>
  <section>
    <h2>Overview</h2>
    <div class="row" id="overview"></div>
  </section>
  <section>
    <h2>Rates</h2>
    <div class="row" id="charts"></div>
  </section>
  <section>
    <h2>Middle-end</h2>
    <div class="row" id="middleend"></div>
  </section>
  <section id="usersSection" hidden>
    <h2>Users</h2>
    <table>
      <thead>
        <tr>
          <th>user</th>
          <th class="n">connections</th>
          <th class="n">unique IPs</th>
          <th class="n">from client</th>
          <th class="n">to client</th>
        </tr>
      </thead>
      <tbody id="users"></tbody>
    </table>
  </section>
  <section>
    <h2>Rejections</h2>
    <table>
      <thead><tr><th>class</th><th class="n">total</th></tr></thead>
      <tbody id="bad"></tbody>
    </table>
    <p class="note" id="badNote" hidden>No connection has been rejected since this process started.</p>
  </section>
</main>
<script nonce="__NONCE__">
"use strict";
const CONFIG = __CONFIG__;
const HISTORY = new Map();

// Prometheus text exposition is line-oriented and this page only ever reads
// what this process itself rendered, so a full parser would be dead weight.
// `# TYPE` is honoured because several names here are gauges despite a
// `_total` suffix, and a couple of counters have no suffix at all.
function parseExposition(text) {
  const types = new Map();
  const series = [];
  for (const rawLine of text.split("\n")) {
    const line = rawLine.trim();
    if (line === "") continue;
    if (line.startsWith("#")) {
      const parts = line.split(/\s+/);
      if (parts[1] === "TYPE" && parts.length >= 4) types.set(parts[2], parts[3]);
      continue;
    }
    const split = line.lastIndexOf(" ");
    if (split < 0) continue;
    const value = Number(line.slice(split + 1));
    if (!Number.isFinite(value)) continue;
    const head = line.slice(0, split);
    const brace = head.indexOf("{");
    const name = brace < 0 ? head : head.slice(0, brace);
    const labels = brace < 0 ? {} : parseLabels(head.slice(brace + 1, head.lastIndexOf("}")));
    series.push({ name, labels, value });
  }
  return { types, series };
}

function parseLabels(text) {
  const labels = {};
  const pattern = /([A-Za-z_][A-Za-z0-9_]*)="((?:[^"\\]|\\.)*)"/g;
  let match;
  while ((match = pattern.exec(text)) !== null) {
    labels[match[1]] = match[2].replace(/\\(.)/g, "$1");
  }
  return labels;
}

function index(parsed) {
  const byName = new Map();
  for (const sample of parsed.series) {
    if (!byName.has(sample.name)) byName.set(sample.name, []);
    byName.get(sample.name).push(sample);
  }
  return byName;
}

function scalar(byName, name, fallback) {
  const samples = byName.get(name);
  if (!samples || samples.length === 0) return fallback;
  return samples[0].value;
}

function labelled(byName, name, label, want) {
  for (const sample of byName.get(name) || []) {
    if (sample.labels[label] === want) return sample.value;
  }
  return 0;
}

function record(name, value, at) {
  if (!HISTORY.has(name)) HISTORY.set(name, []);
  const points = HISTORY.get(name);
  points.push({ at, value });
  // Counters reset when a reload mints a fresh generation, so a negative
  // delta is a reset rather than a rate and is dropped instead of drawn.
  while (points.length > CONFIG.historyPoints) points.shift();
  return points;
}

function ratePoints(points) {
  const rates = [];
  for (let i = 1; i < points.length; i += 1) {
    const dt = (points[i].at - points[i - 1].at) / 1000;
    const dv = points[i].value - points[i - 1].value;
    rates.push(dt > 0 && dv >= 0 ? dv / dt : 0);
  }
  return rates;
}

function humanBytes(value) {
  const units = ["B", "KiB", "MiB", "GiB", "TiB", "PiB"];
  let scaled = value;
  let unit = 0;
  while (scaled >= 1024 && unit < units.length - 1) {
    scaled /= 1024;
    unit += 1;
  }
  return scaled.toFixed(unit === 0 ? 0 : 1) + " " + units[unit];
}

function humanDuration(seconds) {
  const whole = Math.floor(seconds);
  const days = Math.floor(whole / 86400);
  const hours = Math.floor((whole % 86400) / 3600);
  const minutes = Math.floor((whole % 3600) / 60);
  if (days > 0) return days + "d " + hours + "h";
  if (hours > 0) return hours + "h " + minutes + "m";
  return minutes + "m " + (whole % 60) + "s";
}

function card(key, value, unit) {
  const node = document.createElement("div");
  node.className = "card";
  const k = document.createElement("div");
  k.className = "k";
  k.textContent = key;
  const v = document.createElement("div");
  v.className = "v";
  v.textContent = value;
  if (unit) {
    const u = document.createElement("span");
    u.className = "u";
    u.textContent = unit;
    v.appendChild(u);
  }
  node.append(k, v);
  return node;
}

function sparkline(title, points, format) {
  const node = document.createElement("div");
  node.className = "chart";
  const head = document.createElement("div");
  head.className = "k";
  const name = document.createElement("span");
  name.textContent = title;
  const last = document.createElement("span");
  const latest = points.length > 0 ? points[points.length - 1] : 0;
  last.textContent = format(latest);
  head.append(name, last);
  node.appendChild(head);

  const width = 240;
  const height = 56;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + width + " " + height);
  svg.setAttribute("preserveAspectRatio", "none");
  if (points.length > 1) {
    const peak = Math.max(...points, 1e-9);
    const step = width / (points.length - 1);
    let path = "";
    points.forEach((value, i) => {
      const x = (i * step).toFixed(2);
      const y = (height - 4 - (value / peak) * (height - 8)).toFixed(2);
      path += (i === 0 ? "M" : "L") + x + " " + y + " ";
    });
    const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
    line.setAttribute("d", path.trim());
    line.setAttribute("fill", "none");
    line.setAttribute("stroke", "#58a6ff");
    line.setAttribute("stroke-width", "1.5");
    svg.appendChild(line);
  }
  node.appendChild(svg);
  return node;
}

function replace(id, nodes) {
  const host = document.getElementById(id);
  host.replaceChildren(...nodes);
}

function renderOverview(byName, types) {
  const nodes = [];
  const missing = [];
  // Reads the exact families src/metrics.rs emits. A name that is not in the
  // exposition is reported rather than drawn as a zero, because a silent zero
  // reads as "the proxy is idle" and is indistinguishable from a rename.
  const need = (name) => {
    if (!byName.has(name)) {
      missing.push(name);
      return null;
    }
    return scalar(byName, name, 0);
  };

  nodes.push(card("uptime", humanDuration(need("telemt_uptime_seconds") || 0)));
  nodes.push(card("accepted", (need("telemt_connections_total") || 0).toFixed(0)));
  nodes.push(card("rejected", (need("telemt_connections_bad_total") || 0).toFixed(0)));

  // There is no global live-connection gauge; Direct relay sessions are
  // reported per buffer tier, so they are summed here.
  const sessions = (byName.get("telemt_direct_relay_buffer_sessions") || [])
    .reduce((total, sample) => total + sample.value, 0);
  nodes.push(card("direct sessions", sessions.toFixed(0)));

  nodes.push(card("tracked IPs", (need("telemt_ip_tracker_entries") || 0).toFixed(0)));
  nodes.push(card(
    "active users",
    labelled(byName, "telemt_ip_tracker_users", "scope", "active").toFixed(0)
  ));
  nodes.push(card("ME writers", (need("telemt_me_writers_active_current") || 0).toFixed(0)));
  nodes.push(card("buffers in use",
    labelled(byName, "telemt_buffer_pool_buffers_total", "kind", "in_use").toFixed(0)));

  const telemetry = scalar(byName, "telemt_telemetry_core_enabled", 1);
  const flag = document.createElement("div");
  flag.className = "card";
  const flagKey = document.createElement("div");
  flagKey.className = "k";
  flagKey.textContent = "core telemetry";
  const flagValue = document.createElement("div");
  flagValue.className = "v";
  const pill = document.createElement("span");
  pill.className = "pill " + (telemetry === 1 ? "on" : "off");
  pill.textContent = telemetry === 1 ? "enabled" : "disabled";
  flagValue.appendChild(pill);
  flag.append(flagKey, flagValue);
  nodes.push(flag);
  replace("overview", nodes);

  // A zeroed graph is indistinguishable from an idle proxy unless the page
  // says which gates are off, so the disabled case is called out rather than
  // silently drawn as a flat line.
  const status = document.getElementById("status");
  if (telemetry !== 1) {
    status.textContent = "core telemetry is disabled; counters read zero";
    status.className = "err";
  } else if (missing.length > 0) {
    status.textContent = "missing series: " + missing.join(", ");
    status.className = "err";
  }
  return types;
}

function renderCharts(byName, at) {
  const nodes = [];
  const specs = [
    { name: "telemt_connections_total", title: "accepts/s", format: (v) => v.toFixed(2) + "/s" },
    { name: "telemt_connections_bad_total", title: "rejects/s", format: (v) => v.toFixed(2) + "/s" },
    {
      name: "telemt_me_d2c_payload_bytes_total",
      title: "middle-end downstream",
      format: (v) => humanBytes(v) + "/s",
    },
  ];
  for (const spec of specs) {
    if (!byName.has(spec.name)) continue;
    const points = record(spec.name, scalar(byName, spec.name, 0), at);
    nodes.push(sparkline(spec.title, ratePoints(points), spec.format));
  }

  // There are no global octet counters; the per-user families are the only
  // traffic totals in the exposition, and they only exist while per-user
  // telemetry is on.
  const summed = (name) =>
    (byName.get(name) || []).reduce((total, sample) => total + sample.value, 0);
  for (const [name, title] of [
    ["telemt_user_octets_from_client_total", "from client"],
    ["telemt_user_octets_to_client_total", "to client"],
  ]) {
    if (!byName.has(name)) continue;
    const points = record(name, summed(name), at);
    nodes.push(sparkline(title, ratePoints(points), (v) => humanBytes(v) + "/s"));
  }
  replace("charts", nodes);
}

function renderMiddleEnd(byName) {
  const nodes = [];
  const pairs = [
    ["writers active", "telemt_me_writers_active_current"],
    ["writers warm", "telemt_me_writers_warm_current"],
    ["reconnects", "telemt_me_reconnect_attempts_total"],
    ["keepalive sent", "telemt_me_keepalive_sent_total"],
    ["keepalive timeout", "telemt_me_keepalive_timeout_total"],
    ["handshake rejects", "telemt_me_handshake_reject_total"],
  ];
  for (const [label, name] of pairs) {
    if (!byName.has(name)) continue;
    nodes.push(card(label, scalar(byName, name, 0).toFixed(0)));
  }
  if (nodes.length === 0) {
    nodes.push(card("middle-end", "not in use"));
  }
  replace("middleend", nodes);
}

function renderUsers(byName) {
  const section = document.getElementById("usersSection");
  if (!CONFIG.showUsers) {
    section.hidden = true;
    return;
  }
  const rows = new Map();
  const take = (name, key) => {
    for (const sample of byName.get(name) || []) {
      const user = sample.labels.user;
      if (user === undefined) continue;
      if (!rows.has(user)) rows.set(user, {});
      rows.get(user)[key] = sample.value;
    }
  };
  take("telemt_user_connections_current", "connections");
  take("telemt_user_unique_ips_current", "ips");
  take("telemt_user_octets_from_client_total", "from");
  take("telemt_user_octets_to_client_total", "to");

  section.hidden = rows.size === 0;
  const body = document.getElementById("users");
  const nodes = [];
  const names = [...rows.keys()].sort();
  for (const user of names) {
    const row = rows.get(user);
    const tr = document.createElement("tr");
    const cells = [
      user,
      (row.connections || 0).toFixed(0),
      (row.ips || 0).toFixed(0),
      humanBytes(row.from || 0),
      humanBytes(row.to || 0),
    ];
    cells.forEach((text, i) => {
      const td = document.createElement("td");
      if (i > 0) td.className = "n";
      td.textContent = text;
      tr.appendChild(td);
    });
    nodes.push(tr);
  }
  body.replaceChildren(...nodes);
}

function renderBad(byName) {
  const samples = (byName.get("telemt_connections_bad_by_class_total") || [])
    .filter((sample) => sample.value > 0)
    .sort((a, b) => b.value - a.value);
  const nodes = [];
  for (const sample of samples) {
    const tr = document.createElement("tr");
    const name = document.createElement("td");
    name.textContent = sample.labels.class || "unknown";
    const total = document.createElement("td");
    total.className = "n";
    total.textContent = sample.value.toFixed(0);
    tr.append(name, total);
    nodes.push(tr);
  }
  document.getElementById("bad").replaceChildren(...nodes);
  document.getElementById("badNote").hidden = nodes.length > 0;
}

async function refresh() {
  const status = document.getElementById("status");
  try {
    const response = await fetch(CONFIG.metricsPath, { cache: "no-store" });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const parsed = parseExposition(await response.text());
    const byName = index(parsed);
    const at = Date.now();

    const build = (byName.get("telemt_build_info") || [])[0];
    document.getElementById("version").textContent = build ? build.labels.version || "" : "";
    status.textContent = "updated " + new Date(at).toLocaleTimeString();
    status.className = "";

    renderOverview(byName, parsed.types);
    renderCharts(byName, at);
    renderMiddleEnd(byName);
    renderUsers(byName);
    renderBad(byName);
  } catch (error) {
    status.textContent = "scrape failed: " + error.message;
    status.className = "err";
  }
}

refresh();
setInterval(refresh, CONFIG.refreshSeconds * 1000);
</script>
</body>
</html>
